<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lattice Study Hub</title>
<style>
/* Lattice Study Hub: the techniques behind Fractal, Ruby, Odysseus and Volta, taught in steps, with labs to break.
   Layout after the Diploma Study Hub (stage + step story + "you'll learn" + quiz); labs after the system-design
   sandbox reel (change the numbers and watch where it fails). Plasma HUD look: blue, hairlines, thin-line icons,
   local fonts only (opens offline). Built by view\hub\build.cmd from the parts in view\hub\. */
:root{
  --bg:#060b16; --surface:#0b1424; --sunk:#0f1b30; --ink:#dfeaff; --muted:#8aa0c4; --line:#1d2d4a; --line2:#2a4470;
  --accent:#4cc4ff; --accent2:#7d8bff; --soft:rgba(76,196,255,.10);
  --good:#4fe3a1; --warn:#ffc35c; --bad:#ff6b7a; --odys:#b48cff; --ruby:#ff5c8a;
  --hud:"Bahnschrift","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",monospace;
  --r:12px; --hdr:56px;
}
:root[data-theme="light"]{
  --bg:#eef3fb; --surface:#ffffff; --sunk:#e5ecf8; --ink:#0d1a33; --muted:#4f6185; --line:#cfdaec; --line2:#a9bde0;
  --accent:#0a7fc2; --accent2:#4a55d6; --soft:rgba(10,127,194,.09);
  --good:#13875a; --warn:#a86a00; --bad:#c42a3c; --odys:#7a4fd0; --ruby:#c8235a;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef3fb; --surface:#ffffff; --sunk:#e5ecf8; --ink:#0d1a33; --muted:#4f6185; --line:#cfdaec; --line2:#a9bde0;
  --accent:#0a7fc2; --accent2:#4a55d6; --soft:rgba(10,127,194,.09);
  --good:#13875a; --warn:#a86a00; --bad:#c42a3c; --odys:#7a4fd0; --ruby:#c8235a;}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  background-image:radial-gradient(ellipse at 20% -10%,rgba(76,196,255,.10),transparent 55%),radial-gradient(ellipse at 110% 10%,rgba(125,139,255,.08),transparent 50%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--hud);font-weight:600;letter-spacing:.01em;line-height:1.15;margin:0}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--mono)}
.sm{font-size:.84rem;color:var(--muted)}
.eyebrow{font-family:var(--hud);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.card{background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 92%,var(--accent) 8%),var(--surface));border:1px solid var(--line);border-radius:var(--r);position:relative}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 55%,transparent),transparent 35%,transparent 70%,color-mix(in srgb,var(--accent2) 40%,transparent));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55}
.pad{padding:18px}
.btn{border:1px solid var(--line2);background:var(--sunk);border-radius:9px;padding:8px 14px;display:inline-flex;gap:8px;align-items:center;font-family:var(--hud);letter-spacing:.02em}
.btn:hover{border-color:var(--accent)}
.btn.go{background:color-mix(in srgb,var(--accent) 18%,var(--sunk));border-color:color-mix(in srgb,var(--accent) 60%,var(--line2))}
.btn:disabled{opacity:.4;cursor:default}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn:hover{border-color:var(--accent)}
.tag{font-family:var(--hud);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);border-radius:99px;padding:2px 9px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}

header.app{position:sticky;top:0;z-index:20;height:var(--hdr);display:flex;align-items:center;gap:12px;padding:0 16px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--hud);font-weight:600;font-size:1.12rem;letter-spacing:.06em;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand b{color:var(--accent);font-weight:600}
.crumb{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
#menuBtn{display:none}
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100% - var(--hdr))}
aside.side{border-right:1px solid var(--line);position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));overflow-y:auto;padding:14px 12px 40px}
.side input{width:100%;font-size:.88rem;padding:8px 10px;border-radius:9px;border:1px solid var(--line2);background:var(--sunk);margin-bottom:10px}
.side .mod-h{font-family:var(--hud);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px;display:flex;justify-content:space-between}
.side a{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.88rem;line-height:1.3}
.side a:hover{background:var(--soft)}
.side a.on{background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 2px 0 0 var(--accent)}
.side a .ring{width:16px;height:16px;flex:none}
.side .home{font-family:var(--hud);letter-spacing:.04em}
main{padding:22px clamp(16px,3vw,34px) 60px;min-width:0}

/* home */
.hero{padding:26px;display:grid;gap:10px}
.hero h1{font-size:clamp(1.6rem,3vw,2.3rem)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.tile{padding:16px;display:grid;gap:8px;text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--accent)}
.tile h3{font-size:1.02rem}
.bar{height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.modtitle{margin:28px 0 4px;display:flex;align-items:baseline;gap:12px}
.modtitle h2{font-size:1.25rem}

/* lesson */
.lesson{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);gap:16px;align-items:start}
.lhead{padding:16px 18px;display:grid;gap:8px}
.lhead h1{font-size:clamp(1.35rem,2.4vw,1.8rem)}
.lhead .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.stagewrap{padding:12px}
.metrics{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.metric{flex:1 1 110px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--sunk)}
.metric small{display:block;font-family:var(--hud);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.metric b{font-family:var(--hud);font-weight:600;font-size:1.12rem;transition:color .3s}
.metric b.bump{color:var(--accent)}
.stage{border-radius:10px;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--accent) 7%,var(--sunk)),var(--sunk));border:1px solid var(--line);overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.stage-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.keys{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.8rem}
.dots{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 2px}
.dot{flex:none;display:flex;gap:6px;align-items:center;border:1px solid var(--line2);background:var(--sunk);border-radius:99px;padding:3px 10px 3px 3px;font-size:.78rem;color:var(--muted)}
.dot span{width:20px;height:20px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line2);font-family:var(--hud);font-size:.72rem}
.dot em{font-style:normal;white-space:nowrap}
.dot.past span{background:color-mix(in srgb,var(--accent) 30%,transparent);border-color:var(--accent);color:var(--ink)}
.dot.cur{border-color:var(--accent);color:var(--ink)}
.dot.cur span{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.narr{display:grid;gap:16px;position:sticky;top:calc(var(--hdr) + 16px)}
.story{padding:18px;display:grid;gap:12px;min-height:280px}
.story .top{display:flex;justify-content:space-between;align-items:center}
.story h2{font-size:1.25rem}
.story .body{display:grid;gap:10px}
.story .body code,.prose code{font-family:var(--mono);font-size:.86em;background:var(--sunk);border:1px solid var(--line);padding:0 4px;border-radius:4px}
.keyidea{display:flex;gap:10px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--soft);border-radius:10px;padding:10px 12px}
.keyidea .ic{color:var(--accent);flex:none;margin-top:2px}
.inlattice{border:1px dashed var(--line2);border-radius:10px;padding:9px 12px;font-size:.88rem}
.inlattice small{display:block;font-family:var(--hud);font-size:.66rem;letter-spacing:.14em;color:var(--good);margin-bottom:2px}
.navbtns{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.learn{padding:16px 18px}
.learn h3{font-size:.95rem;margin-bottom:8px}
.learn ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.learn li{display:flex;gap:9px;color:var(--muted);font-size:.9rem;transition:color .3s}
.learn li i{flex:none;width:18px;height:18px;border-radius:99px;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:.7rem;color:transparent;transition:.3s}
.learn li.got{color:var(--ink)}
.learn li.got i{background:var(--good);border-color:var(--good);color:var(--bg)}

/* svg scene */
.el{transition:opacity .45s ease,transform .6s cubic-bezier(.3,.7,.3,1)}
.el.off{opacity:0}
.el.hl .bx{stroke:var(--accent);stroke-width:2;filter:url(#glow)}
.el.hl text{fill:var(--ink)}
.bx{fill:color-mix(in srgb,var(--accent) 9%,var(--sunk));stroke:var(--line2);stroke-width:1.2}
.bx.good{fill:color-mix(in srgb,var(--good) 16%,var(--sunk));stroke:var(--good)}
.bx.bad{fill:color-mix(in srgb,var(--bad) 16%,var(--sunk));stroke:var(--bad)}
.bx.warn{fill:color-mix(in srgb,var(--warn) 14%,var(--sunk));stroke:var(--warn)}
.bx.odys{fill:color-mix(in srgb,var(--odys) 16%,var(--sunk));stroke:var(--odys)}
.lbl{fill:var(--ink);font-family:var(--hud);font-size:13px}
.lbl.sm{fill:var(--muted);font-size:11px}
.lbl.big{font-size:20px}
.ln{stroke:var(--line2);stroke-width:1.4;fill:none}
.ln.flow{stroke:var(--accent);stroke-dasharray:5 5;animation:flow 1.2s linear infinite}
.ln.bad{stroke:var(--bad)}
.ln.good{stroke:var(--good)}
@keyframes flow{to{stroke-dashoffset:-20}}

/* lab + quiz */
.lab{padding:18px;display:grid;gap:14px;margin-top:16px}
.lab h2{font-size:1.2rem}
.lab .cols{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:16px;align-items:start}
.ctl{display:grid;gap:12px}
.ctl label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.ctl label b{color:var(--ink);font-family:var(--hud);font-weight:600}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl input[type=text],.ctl select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--sunk)}
.ctl .row2{display:flex;justify-content:space-between;gap:8px}
.out{display:grid;gap:10px;min-width:0}
.verdict{border-radius:10px;padding:10px 12px;border:1px solid var(--line2);background:var(--sunk);font-size:.92rem}
.verdict.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--sunk))}
.verdict.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--sunk))}
.verdict.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--sunk))}
.labsvg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.quiz{padding:18px;display:grid;gap:12px;margin-top:16px}
.quiz .stmt{font-size:1rem}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line2);background:var(--sunk);border-radius:9px;padding:9px 12px}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--sunk))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--sunk))}
.fb{font-size:.9rem;color:var(--muted);min-height:1.4em}
.prose{display:grid;gap:10px;max-width:72ch}
table.t{border-collapse:collapse;width:100%;font-size:.86rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{font-family:var(--hud);font-weight:600;color:var(--muted);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase}

@media (max-width:1080px){.lesson{grid-template-columns:minmax(0,1fr)}.narr{position:static}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}#menuBtn{display:inline-flex}
  aside.side{position:fixed;z-index:30;top:var(--hdr);left:0;width:min(320px,88vw);background:var(--surface);transform:translateX(-102%);transition:transform .25s}
  body.menu aside.side{transform:none}
  .lab .cols{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.el,.ln.flow{transition:none;animation:none}}
</style>
</head>
<body>
<header class="app">
  <button class="iconbtn" id="menuBtn" aria-label="Lessons"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.4" fill="none"/></svg></button>
  <a class="brand" href="#home"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 2l9.5 5.5v11L13 24l-9.5-5.5v-11z" fill="none" stroke="var(--accent)" stroke-width="1.3"/><path d="M13 7.5l4.8 2.8v5.4L13 18.5l-4.8-2.8v-5.4z" fill="none" stroke="var(--accent2)" stroke-width="1.1"/><circle cx="13" cy="13" r="1.6" fill="var(--accent)"/></svg>LATTICE <b>STUDY HUB</b></a>
  <span class="crumb" id="crumb"></span>
  <button class="iconbtn" id="themeBtn" aria-label="Light or dark"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>
</header>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>
<script>
/* ---------- engine: routing, sidebar, lesson stage, quiz ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let prog=store.get("lattice-hub",{});
const MODS=[], LESSONS=[];
function mod(id,name,blurb){MODS.push({id,name,blurb})}
function lesson(o){LESSONS.push(o)}

/* scene primitives: each returns an <g class="el" id="s-ID"> so steps can show, hide, highlight and move it */
const SC={
  box(id,x,y,w,h,label,cls="",sub=""){return `<g class="el" id="s-${id}"><rect class="bx ${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="9"/>`+
    `<text class="lbl" x="${x+w/2}" y="${y+h/2+(sub?-3:5)}" text-anchor="middle">${esc(label)}</text>`+
    (sub?`<text class="lbl sm" x="${x+w/2}" y="${y+h/2+13}" text-anchor="middle">${esc(sub)}</text>`:"")+`</g>`},
  arrow(id,x1,y1,x2,y2,cls=""){return `<g class="el" id="s-${id}"><path class="ln ${cls}" d="M${x1} ${y1}L${x2} ${y2}" marker-end="url(#ah)"/></g>`},
  curve(id,d,cls=""){return `<g class="el" id="s-${id}"><path class="ln ${cls}" d="${d}" marker-end="url(#ah)"/></g>`},
  text(id,x,y,str,cls="",anchor="middle"){return `<g class="el" id="s-${id}"><text class="lbl ${cls}" x="${x}" y="${y}" text-anchor="${anchor}">${esc(str)}</text></g>`},
  dot(id,x,y,r,cls=""){return `<g class="el" id="s-${id}"><circle class="bx ${cls}" cx="${x}" cy="${y}" r="${r}"/></g>`},
  raw(id,svg){return `<g class="el" id="s-${id}">${svg}</g>`},
};
const DEFS=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--line2)"/></marker>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
const ICON={
  star:`<svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1.5l1.6 4.2 4.4.3-3.4 2.8 1.1 4.3L8 10.7 4.3 13.1l1.1-4.3L2 6l4.4-.3z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>`,
  play:`<path d="M5 3l8 5-8 5z" fill="currentColor"/>`, pause:`<path d="M4 3h3v10H4zM9 3h3v10H9z" fill="currentColor"/>`,
};
function ring(p){const r=6.5,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 16 16"><circle cx="8" cy="8" r="${r}" fill="none" stroke="var(--line2)" stroke-width="1.5"/><circle cx="8" cy="8" r="${r}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 8 8)"/></svg>`}
function done(L){const n=L.steps.length;return Math.min(1,((prog[L.id]??-1)+1)/n)}

function drawSide(active){
  const q=($("#find")?.value||"").toLowerCase();
  $("#side").innerHTML=`<input id="find" placeholder="Find a technique" value="${esc(q)}" aria-label="Find a technique">
   <a href="#home" class="home ${active==="home"?"on":""}">Overview</a><a href="#proof" class="home ${active==="proof"?"on":""}">How the records prove their work</a>`+
   MODS.map(m=>{const ls=LESSONS.filter(l=>l.mod===m.id&&(!q||(l.title+" "+l.sub).toLowerCase().includes(q)));if(!ls.length)return"";
     return `<div class="mod-h"><span>${esc(m.name)}</span><span>${ls.filter(l=>done(l)>=1).length}/${ls.length}</span></div>`+
     ls.map(l=>`<a href="#${l.id}" class="${active===l.id?"on":""}">${ring(done(l))}<span>${esc(l.title)}</span></a>`).join("")}).join("");
  const f=$("#find");f.addEventListener("input",()=>{drawSide(active);const g=$("#find");g.focus();g.setSelectionRange(g.value.length,g.value.length)});
  $$("#side a").forEach(a=>a.addEventListener("click",()=>document.body.classList.remove("menu")));
}

function renderHome(){
  $("#crumb").textContent="Overview";
  const total=LESSONS.length, fin=LESSONS.filter(l=>done(l)>=1).length;
  $("#main").innerHTML=`<div class="card hero"><span class="eyebrow">The academia of the techniques</span>
   <h1>Learn how Lattice works, then try to break it</h1>
   <p class="sm" style="font-size:.95rem;max-width:75ch">Each lesson is one technique Fractal, Ruby, Odysseus or Volta uses. Step through it with the arrow keys, then open its
   lab and change the numbers until it fails: that is where the idea really sinks in. Every lesson ends with where we used it in the records,
   so you can open the proof, and a short check of what stuck. The full write-up of each technique, with its maths and sources, is
   <b>AI academia 13, Techniques, explained</b>.</p>
   <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="bar" style="flex:1;min-width:160px"><i style="width:${total?fin/total*100:0}%"></i></div><span class="sm">${fin} of ${total} lessons finished</span>
   <a class="btn go" href="#${(LESSONS.find(l=>done(l)<1)||LESSONS[0]).id}">${fin?"Carry on":"Start"} <span>→</span></a></div></div>`+
   MODS.map(m=>{const ls=LESSONS.filter(l=>l.mod===m.id);if(!ls.length)return"";
    return `<div class="modtitle"><h2>${esc(m.name)}</h2><span class="sm">${esc(m.blurb)}</span></div><div class="grid">`+

/* exact maths used by the labs */
function lchoose(n,k){let s=0;for(let i=1;i<=k;i++)s+=Math.log(n-k+i)-Math.log(i);return s}
function signP(f,b){const n=f+b;if(!n)return 1;const k=Math.min(f,b);let s=0;for(let i=0;i<=k;i++)s+=Math.exp(lchoose(n,i)-n*Math.LN2);return Math.min(1,2*s)}
function wilson(x,n,z=1.96){if(!n)return[0,1];const p=x/n,z2=z*z,d=1+z2/n,c=(p+z2/(2*n))/d,h=z/d*Math.sqrt(p*(1-p)/n+z2/(4*n*n));return[Math.max(0,c-h),Math.min(1,c+h)]}

 },

lesson({id:"vram",mod:"run",title:"Quantisation and the VRAM budget",min:6,
 sub:"Writing one token reads every weight once. So speed is bandwidth divided by model size, and anything that spills off the card is slow.",
 learn:[["Why speed is bytes per token",2],["What 4-bit weights buy",3],["The VRAM inequality",4],["Why a spill costs 3–4×",5]],
 metrics:[["w","Weights"],["tok","Top speed"],["fit","Fits 16 GB?"]],
 build(){let s=SC.raw("card",`<rect x="40" y="60" width="300" height="230" rx="12" fill="none" stroke="var(--line2)"/><text class="lbl sm" x="190" y="50" text-anchor="middle">graphics card: 16 GB, 896 GB/s</text>`);
  s+=SC.raw("w16",`<rect x="52" y="72" width="276" height="206" rx="8" fill="color-mix(in srgb,var(--bad) 25%,transparent)" stroke="var(--bad)"/><text class="lbl" x="190" y="170" text-anchor="middle">27B at 16 bits = 54 GB</text><text class="lbl sm" x="190" y="190" text-anchor="middle">does not fit</text>`);
  s+=SC.raw("w4",`<rect x="52" y="72" width="276" height="150" rx="8" fill="color-mix(in srgb,var(--accent) 22%,transparent)" stroke="var(--accent)"/><text class="lbl" x="190" y="145" text-anchor="middle">27B at ~4.25 bits ≈ 13.3–15 GB</text>`);
  s+=SC.raw("kv",`<rect x="52" y="226" width="276" height="22" rx="6" fill="color-mix(in srgb,var(--good) 25%,transparent)" stroke="var(--good)"/><text class="lbl sm" x="190" y="241" text-anchor="middle">KV cache for 36K tokens</text>`);
  s+=SC.raw("buf",`<rect x="52" y="252" width="200" height="22" rx="6" fill="color-mix(in srgb,var(--warn) 25%,transparent)" stroke="var(--warn)"/><text class="lbl sm" x="152" y="267" text-anchor="middle">compute buffer + other apps</text>`);
  s+=SC.box("ram",420,90,180,70,"system RAM","bad","~60–90 GB/s");s+=SC.curve("spill","M330 260 C 380 260 400 160 440 160","bad");
  s+=SC.raw("read",`<path d="M360 120 h40" class="ln flow"/><text class="lbl sm" x="380" y="110" text-anchor="middle">every token</text>`);
  s+=SC.text("form",490,230,"top speed ≈ bandwidth ÷ weight size","");s+=SC.text("form2",490,255,"896 ÷ 13.3 ≈ 67 tok/s (measured 50.8)","sm");return s},
 always:["card"],
 steps:[
  {t:"One pass",title:"Each token is a full pass",body:"<p>To write a token, the model multiplies the context through every layer. Each multiplication needs the layer's weights, so <b>every weight is read once per token</b>.</p>"},
  {t:"Too big",title:"At 16 bits, 27 billion weights don't fit",show:["w16"],m:{w:"54 GB",fit:"no"},body:"<p>27 billion parameters × 2 bytes = 54 GB. The card has 16.</p>"},
  {t:"Speed",title:"Speed is bandwidth ÷ bytes",show:["read","form","form2"],body:"<p>If each token reads all the weights, the fastest possible speed is memory bandwidth divided by the weights' size. Weights that are smaller are <b>read faster</b>, not just stored smaller.</p>",key:"Most speed work is about this one division."},
  {t:"4-bit",title:"Quantise: fewer bits per weight",hide:["w16"],show:["w4"],m:{w:"≈13.3 GB",tok:"≈67 max",fit:"yes"},body:"<p>GGUF quantisation stores weights in blocks of small integers with a shared scale (IQ4_XS: about 4.25 bits per weight). The 27B shrinks to about 13.3–15 GB and fits. Quality loss at 4 bits is small for a model this size; at 2–3 bits it grows fast.</p>",lat:"Fractal's file is Qwen3.8-27B-UD-IQ4_XS.gguf: 50.8 tok/s measured, about 76% of the 67 tok/s limit (Fractal academia Part 1.3)."},
  {t:"The budget",title:"Everything shares 16 GB",show:["kv","buf"],body:"<p><code>weights + KV cache + compute buffer + other apps + margin ≤ VRAM</code>. Context, batch size and a game in the background all eat into the same 16 GB.</p>"},
  {t:"Spill",title:"Over budget: layers move to RAM",show:["ram","spill"],m:{tok:"13–17",fit:"spills"},body:"<p>llama.cpp still runs, but the spilled part is read at RAM speed, about a tenth of the card's. Writing falls 3–4× (50 → 13–17 tok/s, seen many times).</p>",lat:"Fractal 3.52: a game ran at 5 fps because Fractal's model stayed on the card; the game guard now unloads it."},
 ],
 records:["<b>Fractal Part 1.2–1.3</b>: the budget and the speed table","<b>Fractal 3.12</b>: 4-bit KV cache","<b>Fractal 3.52</b>: the game at 5 fps","<b>AI academia 01</b>: local inference on consumer GPUs"],
 lab(root){root.innerHTML=`<span class="eyebrow">Lab</span><h2>Fit a model on the card</h2><p class="sm">Pick a model and a card. Push the context or the bits until it spills, and watch the speed fall off a cliff.</p>
  <div class="cols"><div class="ctl">${slider("vp","Parameters (billions)",1,125,1,27)}${slider("vb","Bits per weight",2,16,0.25,4.25)}${slider("vc","Context (thousand tokens)",2,128,1,36)}
  ${slider("vkv","KV bytes per token (KB) for this model",4,256,1,64)}${slider("vg","Card memory (GB)",8,48,1,16)}${slider("vbw","Card bandwidth (GB/s)",200,2000,10,896)}${slider("vo","Other apps on the card (GB)",0,8,0.5,0.5)}</div>
  <div class="out"><svg class="labsvg" viewBox="0 0 520 120" id="vsv"></svg><div class="verdict" id="vv"></div><p class="sm">KV per token depends on the model: 2 × attention layers × KV heads × head size × bytes. Hybrid models like Qwen3.8 keep full attention in only about 1 layer in 4, so theirs is small.</p></div></div>`;
  wire(root,["vp","vb","vc","vkv","vg","vbw","vo"],[0,v=>v,0,0,0,0,0],()=>{const P=val(root,"vp"),b=val(root,"vb"),ctx=val(root,"vc")*1000,kv=val(root,"vkv"),G=val(root,"vg"),bw=val(root,"vbw"),o=val(root,"vo");
   const W=P*b/8,K=kv*1024*ctx/1e9,B=0.8+ctx/1e5,tot=W+K+B+o,sc=480/Math.max(tot,G);
   let x=20,s="";[[W,"accent","weights"],[K,"good","KV"],[B,"warn","buffer"],[o,"odys","other"]].forEach(([v,c,l])=>{s+=`<rect x="${x}" y="30" width="${v*sc}" height="34" fill="color-mix(in srgb,var(--${c}) 30%,transparent)" stroke="var(--${c})"/>`+(v*sc>34?`<text class="lbl sm" x="${x+v*sc/2}" y="51" text-anchor="middle">${l}</text>`:"");x+=v*sc});
   s+=`<line x1="${20+G*sc}" y1="18" x2="${20+G*sc}" y2="78" stroke="var(--bad)" stroke-width="2"/><text class="lbl sm" x="${20+G*sc}" y="96" text-anchor="middle">card: ${G} GB</text>`;
   root.querySelector("#vsv").innerHTML=s;
   const over=tot-G,top=bw/W*0.76;let sp;if(over<=0)sp=top;else{const onCard=Math.max(0,W-over);sp=1/((onCard/(bw*0.76))+(Math.min(W,over)/70))}
   const v=root.querySelector("#vv");v.className="verdict "+(over<=0?"good":"bad");
   v.innerHTML=`Weights ${W.toFixed(1)} GB, KV ${K.toFixed(1)} GB, total ${tot.toFixed(1)} of ${G} GB. `+(over<=0?`Fits. Expect about <b>${sp.toFixed(0)} tok/s</b> (76% of the bandwidth limit, as measured on Fractal's card).`:`<b>Spills ${over.toFixed(1)} GB</b> to system RAM: about <b>${sp.toFixed(1)} tok/s</b>.`)});
 },
 quiz:[{q:"Why do 4-bit weights make writing faster, not just smaller?",o:["Each token reads every weight, so fewer bytes means less to read","The GPU does integer maths faster","They skip layers"],a:0,why:"Writing is limited by memory bandwidth: speed ≈ bandwidth ÷ bytes read per token."},
  {q:"Fractal's model starts writing at 15 tok/s instead of 50. The likeliest cause?",o:["Part of it spilled to system RAM","The prompt was too short","The temperature was too low"],a:0,why:"A spill moves layers to RAM, read about ten times slower: 3–4× slower writing overall."}]});

lesson({id:"kv",mod:"run",title:"The KV cache",min:4,
 sub:"The model remembers each past token as a key and a value in every attention layer. That memory is what context costs.",
 learn:[["What a key and a value are",1],["Why the cache saves recomputing",2],["The bytes formula",3],["Quantising the cache",4]],
 metrics:[["ctx","Context"],["kvb","Cache"]],
 build(){let s="";for(let i=0;i<8;i++){s+=SC.box("tk"+i,40+i*70,60,58,36,"tok "+(i+1))}
  s+=SC.raw("kvrow",Array.from({length:8},(_,i)=>`<rect x="${40+i*70}" y="120" width="26" height="40" rx="4" fill="color-mix(in srgb,var(--accent) 25%,transparent)" stroke="var(--accent)"/><rect x="${72+i*70}" y="120" width="26" height="40" rx="4" fill="color-mix(in srgb,var(--good) 25%,transparent)" stroke="var(--good)"/>`).join("")+`<text class="lbl sm" x="40" y="178">K and V per token, per attention layer</text>`);
  s+=SC.box("new",320,210,120,44,"next token","warn");s+=SC.curve("look","M380 210 C 380 180 200 175 150 162","flow");
  s+=SC.text("f",320,300,"bytes = 2 × attention layers × KV heads × head size × bytes per number × tokens","sm");return s},
 always:["tk0","tk1","tk2","tk3","tk4","tk5","tk6","tk7"],
 steps:[
  {t:"Attention",title:"Each new token looks back at all the others",show:["new","look"],m:{ctx:"8"},body:"<p>Attention compares the new token's <i>query</i> with every earlier token's <i>key</i>, then mixes their <i>values</i> by how well they matched.</p>"},
  {t:"Cache",title:"Keep the keys and values, don't recompute them",show:["kvrow"],body:"<p>Past tokens' keys and values never change, so they are stored. Without the cache, each new token would re-run the whole context through the model.</p>",key:"The cache trades memory for not recomputing the past."},
  {t:"Cost",title:"It grows with every token",show:["f"],m:{kvb:"grows"},body:"<p>The cache is <code>2 × layers × KV heads × head size × bytes × tokens</code>. Grouped-query attention (few KV heads shared by many query heads) and hybrid layers (Qwen3.8: full attention in about 1 layer in 4) keep it small.</p>"},
  {t:"4-bit cache",title:"Store the cache at lower precision",body:"<p>The cache can be quantised too: q8_0 ≈ 8.5 bits, q4_0 ≈ 4.5 bits per number. Halving the cache buys context or room for the MTP drafter.</p>",lat:"Fractal 3.12: the 4-bit KV cache, measured on the haystack recall test (12 of 12 facts at 20K tokens) before adoption."},
 ],

 quiz:[{q:"What does the KV cache store?",o:["Keys and values of past tokens in each attention layer","The model's weights","The user's chat history as text"],a:0,why:"Past keys and values don't change, so they're kept instead of recomputed."}]});

lesson({id:"spec",mod:"run",title:"Speculative decoding",min:6,
 sub:"A cheap drafter guesses the next tokens; the big model checks them all in one pass. Same output, more tokens per weight read.",
 learn:[["Why checking k tokens costs about one pass",1],["Correct by construction",3],["Expected tokens per pass",4],["Why it can still be slower",5]],
 metrics:[["a","Acceptance α"],["k","Draft k"],["e","Tokens / pass"]],
 build(){let s=SC.box("big",250,40,140,60,"27B (target)","", "one pass")+SC.box("dr",60,150,130,50,"drafter","odys","MTP head / n-gram");
  ["the","cat","sat"].forEach((w,i)=>{s+=SC.box("g"+i,230+i*70,160,60,34,w,"")});
  s+=SC.arrow("d1",190,175,226,177);s+=SC.curve("chk","M320 100 C 320 130 320 140 320 156","flow");
  s+=SC.raw("ok",`<text class="lbl" x="260" y="225" text-anchor="middle" fill="var(--good)">kept</text><text class="lbl" x="330" y="225" text-anchor="middle" fill="var(--good)">kept</text>`);
  s+=SC.raw("no",`<text class="lbl" x="400" y="225" text-anchor="middle" fill="var(--bad)">replaced: "on"</text>`);
  s+=SC.text("f",320,290,"E[tokens per pass] = (1 − α^(k+1)) / (1 − α)","");s+=SC.text("f2",320,315,"α = 0.97, k = 1 → 1.97     k = 2 → 2.91","sm");return s},
 steps:[
  {t:"Memory-bound",title:"A pass costs about the same for 1 token or a few",show:["big"],body:"<p>Writing is limited by reading the weights (see the VRAM lesson). Once they're read, checking 3 tokens instead of 1 costs little extra arithmetic.</p>"},
  {t:"Draft",title:"A cheap drafter guesses ahead",show:["dr","g0","g1","g2","d1"],m:{k:3},body:"<p>A drafter proposes the next k tokens. Fractal's drafter is MTP: a small extra layer trained <i>with</i> the model (Qwen3.8 ships one), plus an n-gram matcher that copies repeated text.</p>"},
  {t:"Check",title:"The big model checks all of them in one pass",show:["chk"],body:"<p>The target model runs once over the context plus the guesses and computes what it would have written at each position.</p>"},
  {t:"Keep",title:"Keep matches, replace the first miss",show:["ok","no"],body:"<p>Guesses are kept up to the first disagreement; that position takes the target's own token. The output is exactly what the big model would have written alone.</p>",key:"Only speed changes, never the text (at temperature 0; with sampling, a rejection rule keeps the distribution exact)."},
  {t:"Expected gain",title:"How many tokens per pass?",show:["f","f2"],m:{a:"0.97",k:"1",e:"1.97"},body:"<p>If each guess is accepted with probability α, a pass yields on average (1 − α^(k+1))/(1 − α) tokens: a geometric series that stops at the first miss.</p>"},
  {t:"The catch",title:"Why 2-ahead ran slower than 1-ahead",body:"<p>Each pass costs more: the drafter runs k times and the check is wider. On a full card that extra memory pressure ate the gain: 2-ahead was accepted 83–96% yet slower at 32–36K context than 1-ahead.</p>",lat:"Fractal 3.11 adopted MTP 1-ahead plus n-gram (acceptance: reasoning 0.97, prose 0.87, code 0.85). The 11-file task went from 210 s to 32 s."},
 ],
 records:["<b>Fractal Part 1.5</b>, <b>3.11</b>","<b>AI academia 01</b>: speculative decoding"],
 lab(root){root.innerHTML=`<span class="eyebrow">Lab</span><h2>Tune the drafter</h2><p class="sm">Raise k for more tokens per pass, but every guess costs something. Find where more guessing stops paying.</p>
  <div class="cols"><div class="ctl">${slider("sa","Acceptance α",0.3,0.99,0.01,0.97)}${slider("sk","Draft length k",1,8,1,1)}${slider("sc","Cost of each drafted token (share of a pass)",0,0.5,0.01,0.05)}${slider("sw","Extra cost of a wider check, per token",0,0.3,0.01,0.03)}</div>
  <div class="out"><svg class="labsvg" viewBox="0 0 520 150" id="ssv"></svg><div class="verdict" id="sv"></div></div></div>`;
  wire(root,["sa","sk","sc","sw"],[],()=>{const a=val(root,"sa"),k=val(root,"sk"),c=val(root,"sc"),w=val(root,"sw");
   const sp=K=>((1-Math.pow(a,K+1))/(1-a))/(1+K*c+K*w);let s="",best=1,bv=0;for(let K=1;K<=8;K++){const v=sp(K);if(v>bv){bv=v;best=K}const h=v/3*120;s+=`<rect x="${20+(K-1)*60}" y="${135-h}" width="48" height="${h}" rx="4" fill="${K===k?"var(--accent)":"color-mix(in srgb,var(--accent) 30%,transparent)"}"/><text class="lbl sm" x="${44+(K-1)*60}" y="${130-h}" text-anchor="middle">${v.toFixed(2)}×</text><text class="lbl sm" x="${44+(K-1)*60}" y="148" text-anchor="middle">k=${K}</text>`}
   root.querySelector("#ssv").innerHTML=s;const e=(1-Math.pow(a,k+1))/(1-a),v=root.querySelector("#sv");v.className="verdict "+(k===best?"good":"warn");
   v.innerHTML=`k = ${k}: ${e.toFixed(2)} tokens per pass, about <b>${sp(k).toFixed(2)}×</b> plain speed. Best here: k = ${best} (${bv.toFixed(2)}×).`});
 },
 quiz:[{q:"Does speculative decoding change what the big model writes?",o:["No, only how fast (it keeps the target's own token at the first miss)","Yes, it writes the drafter's text","Only on code"],a:0,why:"Guesses are kept only where they match; the output is the target's."},
  {q:"α = 0.97, k = 1. Tokens per pass?",o:["About 1.97","Exactly 2","0.97"],a:0,why:"(1 − 0.97²)/(1 − 0.97) = 0.0591/0.03 ≈ 1.97."}]});

lesson({id:"voice",mod:"run",title:"Speech synthesis and the latency budget",min:4,
 sub:"A voice feels like conversation only if the first sound comes in under about 3 seconds. Every stage spends part of that budget.",
 learn:[["The stages between speaking and hearing",1],["Why first sound matters more than total time",2],["Streaming in sentences",3]],

 lab(root){root.innerHTML=`<span class="eyebrow">Lab</span><h2>Run a long task in 36K</h2><p class="sm">Each step reads a file. Turn masking on and off, and see on which step the window overflows.</p>

lesson({id:"ppr",mod:"memory",title:"Graph memory with personalised PageRank",min:6,

 build(){const N=[["q",120,180,"your question","warn"],["a",260,90,"Studio"],["b",260,270,"voice"],["c",400,60,"Rust switch"],["d",410,180,"Pocket TTS"],["e",540,120,"port 8012"],["f",540,260,"Chatterbox"]];

  N.forEach(([id,x,y,l,c])=>{s+=SC.dot("n"+id,x,y,26,c||"")+SC.text("l"+id,x,y+44,l,"sm")});
  s+=SC.raw("walk",`<path d="M120 180 L260 270 L410 180 L540 120" class="ln flow"/>`);
  s+=SC.raw("back",`<path d="M540 120 C 400 0 200 40 128 156" class="ln" stroke-dasharray="3 5" marker-end="url(#ah)"/><text class="lbl sm" x="330" y="28" text-anchor="middle">restart: jump back to the question (probability α)</text>`);
  s+=SC.raw("big",`<circle cx="410" cy="180" r="36" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="540" cy="120" r="32" fill="none" stroke="var(--accent)" stroke-width="2"/>`);return s},

 steps:[

  {t:"Walk",title:"A random walk spreads out from them",show:["walk"],body:"<p>Picture a walker that, at each step, follows a random edge from where it stands.</p>"},
  {t:"Restart",title:"…but keeps jumping back to the question",show:["back"],body:"<p>With probability α (about 0.15) it jumps back to a question node instead. So it never wanders far: nodes near the question get visited most.</p><p><code>r = α·e_q + (1 − α)·Pᵀr</code>, iterated until it settles.</p>",key:"Visit frequency is the relevance score."},

 lab(root){root.innerHTML=`<span class="eyebrow">Lab</span><h2>Walk the graph</h2><p class="sm">Click a node to make it the question. Change the restart probability and watch relevance spread or stay close.</p>

  <div class="out"><svg class="labsvg" viewBox="0 0 520 260" id="psv"></svg></div></div>`;
  const N=[[60,130,"question"],[160,60,"Studio"],[160,200,"voice"],[280,40,"Rust"],[290,130,"Pocket"],[400,80,"port 8012"],[400,210,"Chatterbox"],[480,150,"hub note"],[290,230,"d1 clip"]];

  const draw=()=>{const a=val(root,"pa"),n=N.length,adj=N.map(()=>[]);E.forEach(([x,y])=>{adj[x].push(y);adj[y].push(x)});let r=N.map((_,i)=>i===q?1:0);
   for(let it=0;it<60;it++){const nr=N.map((_,i)=>i===q?a:0);r.forEach((v,i)=>adj[i].forEach(j=>nr[j]+=(1-a)*v/adj[i].length));r=nr}

/* a teaching copy of the never-run floor's idea (the real one is rust\parts\tools\src\floor.rs, ~800 lines, 81 tests) */
const FLOOR_RULES=[
 [/^(format|diskpart|bcdedit|cipher\s+\/w)/i,"wipes or reconfigures a disk"],
 [/^(shutdown|restart-computer|stop-computer)\b/i,"restarts or shuts down the PC"],
 [/^(rm|del|erase|rd|rmdir|remove-item|ri)\b(?=.*\s(\/s|-r\w*|-recurse)(\s|$))(?=.*\s["']?([a-z]:\\?|\/)["']?(\s|$))/i,"deletes a whole drive"],
 [/^(rm|remove-item|del)\b.*(-rf|-recurse)\b.*\s(~|\$home|c:\\users)/i,"deletes the user's home"],
 [/^reg\s+delete\s+hk(lm|ey_local_machine)/i,"deletes system registry keys"],
 [/^set-executionpolicy\b/i,"changes Windows' script policy"],
 [/^(vssadmin|wbadmin)\s+delete/i,"deletes backups"],
];
function floorSplit(cmd){const out=[];let cur="",q=null;for(let i=0;i<cmd.length;i++){const c=cmd[i],n=cmd[i+1];
  if(q){cur+=c;if(c===q)q=null;continue}if(c==='"'||c==="'"){q=c;cur+=c;continue}
  if(c===";"||c==="\n"||((c==="&"||c==="|")&&n===c)){out.push(cur);cur="";if(n===c)i++;continue}
  if(c==="|"){out.push(cur);cur="";continue}cur+=c}out.push(cur);return out.map(s=>s.trim()).filter(Boolean)}
function floorPeel(s,trace,depth=0){if(depth>6)return[s];
  const carriers=[/^(?:powershell|pwsh)(?:\.exe)?\s+(?:-\w+\s+)*-(?:c|command)\s+(.+)$/i,/^cmd(?:\.exe)?\s+\/[ck]\s+(.+)$/i,/^(?:bash|sh|wsl)\s+(?:-\w+\s+)*-c\s+(.+)$/i,/^(?:iex|invoke-expression)\s+(.+)$/i,/^&\s*(.+)$/];
  for(const re of carriers){const m=s.match(re);if(m){let inner=m[1].trim().replace(/^["'{]|["'}]$/g,"");trace.push(`peeled a carrier: <code>${esc(s.slice(0,40))}…</code> → <code>${esc(inner)}</code>`);
    return floorSplit(inner).flatMap(x=>floorPeel(x,trace,depth+1))}}
  const enc=s.match(/^(?:powershell|pwsh)(?:\.exe)?\s+.*-e(?:nc|ncodedcommand)?\s+([A-Za-z0-9+/=]+)/i);
  if(enc){try{const b=atob(enc[1]);let t="";for(let i=0;i+1<b.length;i+=2)t+=String.fromCharCode(b.charCodeAt(i)|(b.charCodeAt(i+1)<<8));trace.push(`decoded -EncodedCommand → <code>${esc(t)}</code>`);return floorSplit(t).flatMap(x=>floorPeel(x,trace,depth+1))}catch(e){trace.push("could not decode: refused (fail closed)");return["__undecodable__"]}}
  const sub=[...s.matchAll(/\$\(([^)]*)\)/g)].map(m=>m[1]);if(sub.length){trace.push(`found $( ) inside: <code>${esc(sub.join(" ; "))}</code>`);return[s,...sub.flatMap(x=>floorSplit(x).flatMap(y=>floorPeel(y,trace,depth+1)))]}
  return[s]}
function floorJudge(cmd){const trace=[];if(cmd.length>20000)return{ok:false,why:"too long to read safely: refused",trace};
  const parts=floorSplit(cmd);trace.push(`split into ${parts.length} statement${parts.length>1?"s":""} (outside quotes)`);
  const all=parts.flatMap(p=>floorPeel(p,trace));
  for(const p of all){if(p==="__undecodable__")return{ok:false,why:"an encoded command that can't be read",trace};
   if(/\s-whatif\b/i.test(p))continue;for(const[re,why]of FLOOR_RULES)if(re.test(p))return{ok:false,why,trace,at:p}}
  return{ok:true,trace}}

 lab(root){root.innerHTML=`<span class="eyebrow">Lab</span><h2>Try to sneak a command past the floor</h2><p class="sm">A teaching copy of the floor's idea (a handful of its rules, not all of them). Type a command and see how it's split, peeled and judged. Nothing here runs anything.</p>
  <div class="cols"><div class="ctl"><label>Command<input type="text" id="fc" value='echo hi; cmd /c "format D: /q"'></label>

function renderProof(){
  $("#crumb").textContent="How the records prove their work";
  $("#main").innerHTML=`<div class="card pad prose" style="max-width:none"><span class="eyebrow">The standard, from 24 Nov 2026</span>
   <h1 style="font-size:1.7rem">Every section shows how it was done, and the files that prove it</h1>
   <p>Each section of every academia (Fractal, Ruby, Odysseus, Volta, the NCM lab and AI academia) ends with three blocks. They're written to one standard: <b>AI academia 00, How every record is written</b>.</p>
   <table class="t"><tr><th>Block</th><th>What it holds</th><th>Example</th></tr>
    <tr><td><b>How we did it</b></td><td>The steps in order, the settings that matter, and the bar set before the run.</td><td>1. Three more hard-exam runs with the line (<code>chain6.cmd</code>). 2. The Rust exam with the playbook alone, then with the line…</td></tr>
    <tr><td><b>Proof</b></td><td>What ran, the result files, the code, a command to check it yourself, and what was <i>not</i> kept. Every path was checked when it was written, and the docs page marks each one as found or missing.</td><td><code>Fractal\\exam-kit\\results\\r1-book-cases.jsonl</code><br>Check it yourself: <code>exam pair results\\r1-book-cases.jsonl results\\r1-book.jsonl</code></td></tr>
    <tr><td><b>The idea behind it</b></td><td>A link to the technique's lesson here, and its full write-up in AI academia 13.</td><td>Paired comparison and the sign test</td></tr></table>
   <h2 style="font-size:1.2rem;margin-top:8px">Why "check it yourself" re-grades instead of re-running</h2>
   <p>Every answer a model gave in an exam is saved. Re-grading those answers against the hidden tests needs no model and takes seconds, and it gives the same verdicts if the record is honest. Re-running the model costs GPU time and differs a little from run to run (see <a href="#repeats">Repeats and the noise floor</a>).</p>
   <h2 style="font-size:1.2rem;margin-top:8px">What "Not kept" means</h2>
   <p>Some early work only printed its result to a console, and some files went in the 12 Nov clean-up. Those gaps are written down where they are, not hidden. A number with no file behind it says so.</p></div>`;
  drawSide("proof");
}
function route(){const h=location.hash.slice(1)||"home";const l=LESSONS.find(x=>x.id===h);L=null;stopAuto();
  if(l)renderLesson(l);else if(h==="proof")renderProof();else{renderHome();drawSide("home")}window.scrollTo(0,0)}
addEventListener("hashchange",route);
$("#menuBtn").addEventListener("click",()=>document.body.classList.toggle("menu"));
$("#themeBtn").addEventListener("click",()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":!matchMedia("(prefers-color-scheme: light)").matches;r.dataset.theme=dark?"light":"dark";store.set("lattice-hub-theme",r.dataset.theme)});
(()=>{const t=store.get("lattice-hub-theme",null);if(t)document.documentElement.dataset.theme=t})();
route();
</script>
</body>
</html>
